{% extends "adminpanel/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh; margin-left: 0;">
    <div class="card" style="width: 400px; border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-box-seam" style="font-size: 2.5rem; color: #1a2332;"></i>
                <h3 class="mt-2 mb-0">Shabiby Cargo</h3>
                <p class="text-muted">Admin Panel Login</p>
            </div>
            {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
            {% endif %}
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" style="background: #1a2332; border: none;">
                    <i class="bi bi-box-arrow-in-right"></i> Login
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
