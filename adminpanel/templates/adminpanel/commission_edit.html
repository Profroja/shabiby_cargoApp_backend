{% extends "adminpanel/base.html" %}
{% block title %}Edit Commission Band{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Edit Commission Band</h2>
    <a href="{% url 'adminpanel:commissions' %}" class="btn btn-outline-secondary btn-sm">← Back to Commissions</a>
</div>

{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

<div class="card stat-card" style="max-width: 640px;">
    <div class="card-body">
        <form method="post" action="{% url 'adminpanel:commission-edit' band.pk %}" class="row g-3">
            {% csrf_token %}
            <div class="col-md-6">
                <label class="form-label">Min distance (km)</label>
                <input type="number" step="0.01" min="0" name="min_distance_km" class="form-control"
                       value="{{ band.min_distance_km }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Max distance (km)</label>
                <input type="number" step="0.01" min="0" name="max_distance_km" class="form-control"
                       value="{{ band.max_distance_km|default:'' }}" placeholder="∞ if empty">
            </div>
            <div class="col-md-6">
                <label class="form-label">Commission %</label>
                <input type="number" step="0.01" min="0" name="commission_percent" class="form-control"
                       value="{{ band.commission_percent }}" required>
            </div>
            <div class="col-md-6 d-flex align-items-end">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" name="is_active" {% if band.is_active %}checked{% endif %}>
                    <label class="form-check-label">Active</label>
                </div>
            </div>
            <div class="col-12">
                <button class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
